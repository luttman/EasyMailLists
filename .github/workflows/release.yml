name: Release

# Push a tag such as v2.0.1 to package the addon and publish it to CurseForge and GitHub.
# Needs the repository secret CF_API_KEY (a CurseForge API token).
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # -t: the addon is in the EasyMailLists folder, not at the top of the repository
      - uses: BigWigsMods/packager@v2
        with:
          args: -t EasyMailLists
        env:
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
          GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
