name: Release

# Push a tag such as v2.0.1 to package the addon and publish it to CurseForge and GitHub.
# Needs the repository secret CF_API_KEY (a CurseForge API token).
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The addon is in the EasyMailLists folder, but the packager wants the TOC at the top of a checkout.
      # Stage a copy: the addon files at the top, with the repository's git data so it can find the tag.
      # "git add" only marks the copied files as tracked, so the packager doesn't skip them.
      - name: Stage the addon
        run: |
          mkdir ../stage
          cp -r .git ../stage/.git
          cp -r EasyMailLists/. ../stage/
          git -C ../stage add -A

      - uses: BigWigsMods/packager@v2
        with:
          args: -t ../stage
        env:
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
          GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
